name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Record compatibility environment
        run: |
          sw_vers
          uname -m
          swift --version
      - name: Build and test on minimum macOS
        run: swift test
  # macOS 14 hosted runners retire November 2, 2026; replace this job
  # with an explicit minimum-OS test host, never silently macos-latest.
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
      - name: Verify update launch and rollback
        run: python3 scripts/quality/update_rollback.py
      - name: Package app
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OxyMacCleaner-arm64
          path: |
            dist/OxyMacCleaner-*-macOS-arm64.zip
            dist/SHA256SUMS.txt
